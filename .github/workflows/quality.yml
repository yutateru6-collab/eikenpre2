name: PRE2 structure and repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, checked 2026-09-11
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, checked 2026-09-11
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test structural validator (not content quality)
        run: python -m unittest discover -s tests -v
      - name: Check profile, local links and Python syntax
        run: python tools/check_repo.py
