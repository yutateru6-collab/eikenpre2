name: Validate Pre-2 specifications
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-11
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-11
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check specification and local references
        run: python3 tools/check_repository.py
